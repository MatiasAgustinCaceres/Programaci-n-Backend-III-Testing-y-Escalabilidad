tags:
  - name: Orders
    description: Endpoints de gestión de pedidos

paths:
  /api/orders:
    get:
      summary: Listar pedidos
      tags: [Orders]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Número de página (por defecto 1)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Cantidad de resultados por página (por defecto 20)
      responses:
        '200':
          description: Lista de pedidos paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
    post:
      summary: Crear pedido
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/orders/{id}:
    get:
      summary: Obtener pedido por ID
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/invoice:
    post:
      summary: Subir factura o comprobante de pedido
      tags: [Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID del pedido
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo de factura/comprobante
                docType:
                  type: string
                  description: Tipo de documento (ej. factura, comprobante_pago)
      responses:
        '200':
          description: Factura/comprobante subido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMetadata'
        '400':
          description: Error de archivo requerido, tipo inválido o tamaño superado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
